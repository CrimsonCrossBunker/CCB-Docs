site_name: CCB Developer Documentation
site_description: Bilingual developer documentation for Cataclysm Cleanwater Bomb
site_url: https://crimsoncrossbunker.github.io/CCB-Docs/
repo_url: https://github.com/CrimsonCrossBunker/CCB-Docs
repo_name: CrimsonCrossBunker/CCB-Docs
edit_uri: edit/main/docs/
copyright: CC BY-SA 3.0 · CrimsonCrossBunker contributors

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/site.js
