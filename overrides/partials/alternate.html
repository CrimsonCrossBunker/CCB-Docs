<div class="md-header__option">
  <div class="md-select">
    {% set icon = config.theme.icon.alternate or "material/translate" %}
    <button class="md-header__button md-icon" aria-label="{{ lang.t('select.language') }}">
      {% include ".icons/" ~ icon ~ ".svg" %}
    </button>
    <div class="md-select__inner">
      <ul class="md-select__list">
        {% for alt in config.extra.alternate %}
          {% set target = page.meta.alternate_urls[alt.lang] if page and page.meta and page.meta.alternate_urls else alt.link %}
          <li class="md-select__item">
            <a href="{{ target }}" hreflang="{{ alt.lang }}" class="md-select__link"
              {% if page and page.meta and target != page.meta.canonical_url %}data-ccb-language-switch{% endif %}>
              {{ alt.name }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
