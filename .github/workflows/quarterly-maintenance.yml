name: Quarterly Agent, permissions, and archive audit

on:
  schedule:
    - cron: "31 5 2 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quarterly-documentation-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out authoritative CCB source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: master
          path: .build/ccb-source
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run authoritative CCB Agent benchmark and generate report
        run: >-
          uv run python scripts/generate_maintenance_reports.py agent-benchmark
          --source-repo .build/ccb-source
          --target-ref HEAD
          --run-source-benchmark
          --json-output .build/quarterly/agent-benchmark.json

      - name: Generate permissions audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/generate_maintenance_reports.py permissions
          --github-repository "${{ github.repository }}"
          --github-organization "${{ github.repository_owner }}"
          --github-token-env GITHUB_TOKEN
          --json-output .build/quarterly/permissions.json

      - name: Generate archive review
        run: >-
          uv run python scripts/generate_maintenance_reports.py archive
          --json-output .build/quarterly/archive.json

      - name: Reconcile Agent benchmark Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/manage_tracking_issues.py maintenance
          --report .build/quarterly/agent-benchmark.json
          --key quarterly-agent-benchmark
          --title "[maintenance] Quarterly Agent benchmark readiness"

      - name: Reconcile permissions audit Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/manage_tracking_issues.py maintenance
          --report .build/quarterly/permissions.json
          --key quarterly-permissions-audit
          --title "[maintenance] Quarterly permissions audit"

      - name: Reconcile archive review Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/manage_tracking_issues.py maintenance
          --report .build/quarterly/archive.json
          --key quarterly-archive-review
          --title "[maintenance] Quarterly archive review"

      - name: Upload quarterly audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarterly-documentation-audit-${{ github.run_id }}
          path: .build/quarterly/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Write quarterly Job Summary
        if: always()
        run: >-
          python3 scripts/write_workflow_summary.py
          --title "Quarterly documentation governance"
          --report .build/quarterly/agent-benchmark.json
          --report .build/quarterly/permissions.json
          --report .build/quarterly/archive.json
