name: Documentation snapshot and restore test

on:
  schedule:
    - cron: "43 6 3 * *"
  repository_dispatch:
    types: [ccb-release-published]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional 40-character CCB release commit SHA; requires source_tag
        required: false
        type: string
      source_tag:
        description: Optional CCB release tag; requires source_sha
        required: false
        type: string

permissions: {}

concurrency:
  group: documentation-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate CCB release metadata
        id: release
        shell: bash
        env:
          DISPATCH_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          DISPATCH_SOURCE_TAG: ${{ github.event.client_payload.source_tag }}
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha }}
          MANUAL_SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          source_sha=""
          source_tag=""
          if [[ "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            if [[ "${DISPATCH_SOURCE_REPOSITORY}" != \
              "CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb" ]]; then
              echo "release dispatch source_repository is not the authoritative CCB repository" >&2
              exit 1
            fi
            source_sha="${DISPATCH_SOURCE_SHA}"
            source_tag="${DISPATCH_SOURCE_TAG}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            source_sha="${MANUAL_SOURCE_SHA}"
            source_tag="${MANUAL_SOURCE_TAG}"
            if [[ -n "${source_sha}" || -n "${source_tag}" ]]; then
              if [[ -z "${source_sha}" || -z "${source_tag}" ]]; then
                echo "manual release snapshots require both source_sha and source_tag" >&2
                exit 1
              fi
            fi
          fi
          if [[ -n "${source_sha}" ]]; then
            if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "CCB release source_sha must be a lowercase 40-character commit SHA" >&2
              exit 1
            fi
            if [[ ! "${source_tag}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$ ]]; then
              echo "CCB release source_tag must be a safe 1-64 character tag" >&2
              exit 1
            fi
            snapshot_label="${source_tag}-${source_sha}"
            archive_key="${source_sha}"
          else
            snapshot_label="docs-${GITHUB_SHA}"
            archive_key="${GITHUB_SHA}"
          fi
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_tag=${source_tag}" >> "${GITHUB_OUTPUT}"
          echo "snapshot_label=${snapshot_label}" >> "${GITHUB_OUTPUT}"
          echo "archive_key=${archive_key}" >> "${GITHUB_OUTPUT}"

      - name: Check out tagged authoritative CCB release
        if: steps.release.outputs.source_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: ${{ steps.release.outputs.source_tag }}
          path: .build/ccb-release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the CCB release tag resolves to the supplied SHA
        if: steps.release.outputs.source_sha != ''
        shell: bash
        env:
          EXPECTED_CCB_RELEASE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C .build/ccb-release-source rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_CCB_RELEASE_SHA}" ]]; then
            echo "CCB release tag resolved to ${actual_sha}, not the supplied SHA" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Check generated catalog
        run: uv run python scripts/generate_catalog.py --check

      - name: Build strict production site
        run: uv run python scripts/build_site.py --strict

      - name: Create deterministic snapshot and run restore test
        run: >-
          uv run python scripts/create_docs_snapshot.py
          --site-dir site
          --output .build/snapshot/ccb-docs-${{ steps.release.outputs.archive_key }}.zip
          --label "${{ steps.release.outputs.snapshot_label }}"
          --json-output .build/snapshot/restore-health.json

      - name: Upload documentation snapshot and restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccb-docs-snapshot-${{ github.run_id }}
          path: .build/snapshot/
          if-no-files-found: warn
          retention-days: 90

      - name: Write snapshot Job Summary
        if: always()
        run: >-
          python3 scripts/write_workflow_summary.py
          --title "Documentation snapshot and restore"
          --report .build/snapshot/restore-health.json

  reconcile-health:
    needs: snapshot
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        )
      }}
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Download snapshot restore evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ccb-docs-snapshot-${{ github.run_id }}
          path: .build/snapshot

      - name: Ensure snapshot workflow failure evidence exists
        if: always()
        env:
          SNAPSHOT_JOB_RESULT: ${{ needs.snapshot.result }}
        run: >-
          python3 scripts/create_docs_snapshot.py
          --ensure-workflow-failure-report
          --workflow-result "${SNAPSHOT_JOB_RESULT}"
          --json-output .build/snapshot/restore-health.json

      - name: Reconcile snapshot restore-health Issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/manage_tracking_issues.py maintenance
          --report .build/snapshot/restore-health.json
          --key snapshot-restore-health
          --title "[maintenance] Documentation snapshot restore health"
