name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned CCB Lua contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: d32b9cc880a85480840d82cfa05d256c78a16615
          path: .source/ccb
          fetch-depth: 1
          sparse-checkout: |
            data/lua

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Resolve legacy migration source commit
        id: legacy-migration-source
        run: echo "commit=$(uv run python scripts/generate_legacy_migration.py --print-source-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned CCB migration inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: ${{ steps.legacy-migration-source.outputs.commit }}
          path: .source/ccb-migration
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            doc/migration/markdown-inventory.yml

      - name: Materialize audited legacy source paths
        run: |
          uv run python scripts/generate_legacy_migration.py \
            --source-repo .source/ccb-migration --print-source-paths \
            > .source/ccb-migration-paths.txt
          git -C .source/ccb-migration sparse-checkout set --stdin \
            < .source/ccb-migration-paths.txt

      - name: Check legacy migration pages and cross-repository coverage
        run: >-
          uv run python scripts/generate_legacy_migration.py
          --source-repo .source/ccb-migration --check

      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lua5.4
          luac -v

      - name: Resolve JSON/EOC source commit from catalog
        id: json-eoc-source
        run: echo "commit=$(uv run python scripts/generate_json_eoc_reference.py --print-source-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out authoritative CCB JSON/EOC contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: ${{ steps.json-eoc-source.outputs.commit }}
          path: .source/ccb-json-eoc
          fetch-depth: 1
          sparse-checkout: |
            data/reference/json
            tools/json_api

      - name: Check generated JSON/EOC reference and example mod
        run: |
          uv run python scripts/generate_json_eoc_reference.py --source-repo .source/ccb-json-eoc --check
          uv run python scripts/check_json_eoc_example_mod.py --source-repo .source/ccb-json-eoc

      - name: Validate production inputs
        run: |
          uv run python scripts/generate_lua_reference.py --source-repo .source/ccb --check --require-luac
          uv run python scripts/generate_catalog.py --check
          uv run python scripts/check_catalog.py

      - name: Build production site and offline snapshot without drafts
        run: >-
          uv run python scripts/build_site.py
          --strict
          --offline-archive artifacts/ccb-docs-offline.zip

      - name: Check production links
        run: uv run python scripts/check_links.py --site-dir site --critical

      - name: Check rendered production metadata and accessibility basics
        run: uv run python scripts/check_site_quality.py --site-dir site

      - name: Check bilingual production search fixtures
        run: uv run python scripts/check_search.py --site-dir site

      - name: Upload offline documentation snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccb-docs-offline-${{ github.sha }}
          path: artifacts/ccb-docs-offline.zip
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages artifact
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
