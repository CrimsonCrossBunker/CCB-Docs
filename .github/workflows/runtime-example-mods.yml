name: Runtime example Mod validation

on:
  pull_request:
    paths:
      - .github/workflows/runtime-example-mods.yml
      - config/runtime-example-validation.yml
      - examples/**
      - pyproject.toml
      - schemas/runtime-example-validation.schema.json
      - scripts/resolve_runtime_validation_source.py
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-example-mods-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-examples:
    name: CCB runtime example Mods
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCB_SOURCE_DIR: .source/ccb
      CCB_BUILD_DIR: .build/ccb-headless
      CCB_RUNTIME_BINARY: .build/ccb-headless/src/cataclysm
      CCB_RUNTIME_USER_DIR: .build/runtime-user
    steps:
      - name: Check out CCB-Docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync locked documentation dependencies
        run: uv sync --frozen

      - name: Resolve the reviewed runtime-validation source commit
        id: runtime-source
        shell: bash
        run: |
          commit="$(uv run python scripts/resolve_runtime_validation_source.py --print-source-commit)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid CCB source commit: $commit" >&2
            exit 1
          fi
          build_backend="$(
            uv run python scripts/resolve_runtime_validation_source.py \
              --print-build-backend
          )"
          if [[ "$build_backend" != "cmake_headless" ]]; then
            echo "Unsupported runtime build backend: $build_backend" >&2
            exit 1
          fi
          command_timeout_seconds="$(
            uv run python scripts/resolve_runtime_validation_source.py \
              --print-command-timeout-seconds
          )"
          if [[ ! "$command_timeout_seconds" =~ ^[0-9]+$ ]]; then
            echo "Invalid runtime command timeout: $command_timeout_seconds" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "build_backend=$build_backend" >> "$GITHUB_OUTPUT"
          echo "command_timeout_seconds=$command_timeout_seconds" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned full CCB source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: ${{ steps.runtime-source.outputs.commit }}
          path: .source/ccb
          fetch-depth: 1
          persist-credentials: false

      - name: Validate the pinned CCB build and runtime contracts
        run: python3 "$CCB_SOURCE_DIR/tools/lua_api/check_cmake_contract.py"

      - name: Build the release headless executable with Lua enabled
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/logs
          cmake -S "$CCB_SOURCE_DIR" -B "$CCB_BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DHEADLESS=ON \
            -DCURSES=OFF \
            -DTILES=OFF \
            -DSOUND=OFF \
            -DLOCALIZE=OFF \
            -DTESTS=OFF \
            -DCATA_ENABLE_LUA_PLATFORM=ON \
            -DUSE_PREFIX_DATA_DIR=OFF \
            -DCATA_CCACHE=OFF \
            2>&1 | tee .build/logs/ccb-configure.log
          cmake --build "$CCB_BUILD_DIR" \
            --target cataclysm \
            --parallel 2 \
            2>&1 | tee .build/logs/ccb-build.log
          test -x "$CCB_RUNTIME_BINARY"

      - name: Install both maintained examples as user Mods
        shell: bash
        run: |
          mkdir -p "$CCB_RUNTIME_USER_DIR/mods" "$CCB_RUNTIME_USER_DIR/config"
          cp -a \
            examples/complete-lua-mod \
            "$CCB_RUNTIME_USER_DIR/mods/ccb_docs_lua_example"
          cp -a \
            examples/complete-json-eoc-mod \
            "$CCB_RUNTIME_USER_DIR/mods/ccb_docs_json_eoc_example"

      - name: Execute positive and negative runtime examples
        shell: bash
        env:
          LC_ALL: C.UTF-8
          RUNTIME_COMMAND_TIMEOUT_SECONDS: ${{ steps.runtime-source.outputs.command_timeout_seconds }}
        run: |
          set -o pipefail
          run_mod_check() {
            local log_name="$1"
            shift
            printf 'Starting runtime validation: %s\n' "$*"
            timeout --signal=TERM --kill-after=15s \
              "${RUNTIME_COMMAND_TIMEOUT_SECONDS}s" \
              stdbuf -oL -eL "$CCB_RUNTIME_BINARY" \
              --datadir "$CCB_SOURCE_DIR/data/" \
              --userdir "$CCB_RUNTIME_USER_DIR/" \
              --check-mods "$@" \
              2>&1 | tee ".build/logs/${log_name}.log"
          }
          lua_main="$CCB_RUNTIME_USER_DIR/mods/ccb_docs_lua_example/main.lua"
          original_lua_main="$GITHUB_WORKSPACE/examples/complete-lua-mod/main.lua"

          printf '\nerror("validation execution sentinel")\n' >> "$lua_main"
          trap 'cp "$original_lua_main" "$lua_main"' EXIT
          if run_mod_check lua-negative-sentinel ccb_docs_lua_example; then
            echo "Lua validation unexpectedly accepted the execution sentinel" >&2
            exit 1
          else
            sentinel_status=$?
          fi
          if [ "$sentinel_status" -ne 1 ]; then
            echo "Lua validation crashed or timed out (exit $sentinel_status)" >&2
            exit 1
          fi
          grep -F "validation execution sentinel" \
            .build/logs/lua-negative-sentinel.log

          cp "$original_lua_main" "$lua_main"
          trap - EXIT
          run_mod_check examples-positive \
            ccb_docs_lua_example \
            ccb_docs_json_eoc_example

      - name: Collect minimal failure logs
        if: failure()
        shell: bash
        env:
          CCB_SOURCE_COMMIT: ${{ steps.runtime-source.outputs.commit }}
        run: |
          mkdir -p .build/failure-logs
          printf 'CCB source commit: %s\nWorkflow run: %s attempt %s\n' \
            "$CCB_SOURCE_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > .build/failure-logs/context.txt
          for log in .build/logs/*.log "$CCB_RUNTIME_USER_DIR/config/debug.log"; do
            if [[ -f "$log" ]]; then
              tail -n 400 "$log" > ".build/failure-logs/$(basename "$log")"
            fi
          done

      - name: Upload minimal failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-example-mod-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/failure-logs/
          if-no-files-found: error
          retention-days: 7
