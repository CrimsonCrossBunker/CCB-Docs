name: Documentation debt maintenance

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: documentation-debt-maintenance
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out authoritative CCB source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: master
          path: .build/ccb-source
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Generate translation debt report
        run: |
          uv run python scripts/generate_catalog.py --check
          uv run python scripts/check_catalog.py \
            --source-repo .build/ccb-source \
            --report-translation-debt \
            --json-output .build/translation-debt.json

      - name: Build scheduled preview
        run: uv run python scripts/build_site.py --strict --include-drafts

      - name: Check ordinary external links as warnings
        id: external_links
        continue-on-error: true
        run: >-
          uv run python scripts/check_links.py
          --site-dir site
          --external
          --json-output .build/link-report.json

      - name: Detect source-path drift
        run: >-
          uv run python scripts/check_source_drift.py
          --source-repo .build/ccb-source
          --target-ref HEAD
          --json-output .build/source-drift.json

      - name: Reconcile translation tracking issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/manage_tracking_issues.py translation
          --report .build/translation-debt.json

      - name: Reconcile external-link warning issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/manage_tracking_issues.py links
          --report .build/link-report.json

      - name: Update the aggregate source-drift draft PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/manage_tracking_issues.py drift
          --report .build/source-drift.json
          --base main
          --branch automation/source-drift

      - name: Preserve required link failures
        if: steps.external_links.outcome == 'failure'
        run: exit 1
