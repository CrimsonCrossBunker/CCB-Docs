name: Documentation debt maintenance

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: documentation-debt-maintenance
  cancel-in-progress: false

jobs:
  report:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out authoritative CCB source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: master
          path: .build/ccb-source
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Generate translation debt report
        run: |
          uv run python scripts/generate_catalog.py --check
          uv run python scripts/check_catalog.py \
            --source-repo .build/ccb-source \
            --report-translation-debt \
            --json-output .build/translation-debt.json
          ls -la .build/

      - name: Build scheduled preview
        run: uv run python scripts/build_site.py --strict --include-drafts

      - name: Check ordinary external links as warnings
        id: external_links
        continue-on-error: true
        run: >-
          uv run python scripts/check_links.py
          --site-dir site
          --external
          --json-output .build/link-report.json

      - name: Detect source-path drift
        run: |
          uv run python scripts/check_source_drift.py \
            --source-repo .build/ccb-source \
            --target-ref HEAD \
            --json-output .build/source-drift.json
          ls -la .build/

      - name: Upload weekly maintenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-documentation-maintenance-${{ github.run_id }}
          path: .build/
          if-no-files-found: warn
          retention-days: 90

      - name: Write weekly Job Summary
        if: always()
        run: >-
          python3 scripts/write_workflow_summary.py
          --title "Weekly documentation maintenance"
          --report .build/translation-debt.json
          --report .build/link-report.json
          --report .build/source-drift.json

  reconcile:
    needs: report
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out documentation repository for the aggregate drift branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Download read-only weekly evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: weekly-documentation-maintenance-${{ github.run_id }}
          path: .build

      - name: Reconcile translation tracking issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/manage_tracking_issues.py translation
          --report .build/translation-debt.json

      - name: Reconcile external-link warning issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/manage_tracking_issues.py links
          --report .build/link-report.json

      - name: Update the aggregate source-drift draft PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/manage_tracking_issues.py drift
          --report .build/source-drift.json
          --base main
          --branch automation/source-drift
