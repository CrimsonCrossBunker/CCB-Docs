name: Documentation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out pinned CCB Lua contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: d32b9cc880a85480840d82cfa05d256c78a16615
          path: .source/ccb
          fetch-depth: 1
          sparse-checkout: |
            data/lua

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lua5.4
          luac -v

      - name: Resolve JSON/EOC source commit from catalog
        id: json-eoc-source
        run: echo "commit=$(uv run python scripts/generate_json_eoc_reference.py --print-source-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out authoritative CCB JSON/EOC contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: ${{ steps.json-eoc-source.outputs.commit }}
          path: .source/ccb-json-eoc
          fetch-depth: 1
          sparse-checkout: |
            data/reference/json
            tools/json_api

      - name: Check generated JSON/EOC reference and example mod
        run: |
          uv run python scripts/generate_json_eoc_reference.py --source-repo .source/ccb-json-eoc --check
          uv run python scripts/check_json_eoc_example_mod.py --source-repo .source/ccb-json-eoc

      - name: Check generated catalog output
        run: uv run python scripts/generate_catalog.py --check

      - name: Check generated Lua v5 reference and coverage
        run: >-
          uv run python scripts/generate_lua_reference.py
          --source-repo .source/ccb --check --require-luac

      - name: Check marked command examples
        run: uv run python scripts/check_examples.py

      - name: Check catalog and PR-scoped translation policy
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_catalog.py --base-ref "origin/${{ github.base_ref }}"

      - name: Check catalog outside pull requests
        if: github.event_name != 'pull_request'
        run: uv run python scripts/check_catalog.py

      - name: Run policy tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'

      - name: Check scheduled workflow policy
        run: uv run python scripts/check_maintenance_workflows.py

      - name: Lint maintenance code
        run: uv run flake8 --max-line-length=100 scripts tests

      - name: Build strict bilingual preview
        run: uv run python scripts/build_site.py --strict --include-drafts

      - name: Check internal, anchor, and critical external links
        run: uv run python scripts/check_links.py --site-dir site --critical

  site-qa:
    name: Site QA (Node 22)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Sync locked Python dependencies
        run: uv sync --frozen

      - name: Install locked site QA dependencies
        run: npm ci

      - name: Audit site QA dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate catalog inputs
        run: |
          uv run python scripts/generate_catalog.py --check
          uv run python scripts/check_catalog.py

      - name: Build site and deterministic offline snapshot
        run: >-
          uv run python scripts/build_site.py
          --strict
          --include-drafts
          --offline-archive artifacts/ccb-docs-offline.zip

      - name: Check site links
        run: uv run python scripts/check_links.py --site-dir site --critical

      - name: Check rendered metadata, alt text, and contrast
        run: uv run python scripts/check_site_quality.py --site-dir site

      - name: Check bilingual search fixtures
        run: uv run python scripts/check_search.py --site-dir site

      - name: Run Playwright, axe, and visual regression tests
        run: npm run qa:browser

      - name: Run Lighthouse budgets
        run: npm run qa:lighthouse

      - name: Upload QA reports and offline snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccb-docs-site-qa-${{ github.sha }}
          path: |
            artifacts/ccb-docs-offline.zip
            artifacts/lighthouse/
            artifacts/playwright-report/
            artifacts/playwright-results/
          if-no-files-found: warn
          retention-days: 14
