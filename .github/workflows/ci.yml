name: Documentation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out pinned CCB Lua contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: 3ac0bd7f356b30b880dc655f3006ebf1cbda9cfd
          path: .source/ccb
          fetch-depth: 1
          sparse-checkout: |
            data/lua

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Resolve legacy migration source commit
        id: legacy-migration-source
        run: echo "commit=$(uv run python scripts/generate_legacy_migration.py --print-source-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned CCB migration inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: ${{ steps.legacy-migration-source.outputs.commit }}
          path: .source/ccb-migration
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            doc/migration/markdown-inventory.yml

      - name: Materialize audited legacy source paths
        run: |
          uv run python scripts/generate_legacy_migration.py \
            --source-repo .source/ccb-migration --print-source-paths \
            > .source/ccb-migration-paths.txt
          git -C .source/ccb-migration sparse-checkout set --stdin \
            < .source/ccb-migration-paths.txt

      - name: Check legacy migration pages and cross-repository coverage
        run: >-
          uv run python scripts/generate_legacy_migration.py
          --source-repo .source/ccb-migration --check

      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lua5.4
          luac -v

      - name: Resolve JSON/EOC source commit from catalog
        id: json-eoc-source
        run: echo "commit=$(uv run python scripts/generate_json_eoc_reference.py --print-source-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out authoritative CCB JSON/EOC contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrimsonCrossBunker/Cataclysm-Cleanwater-Bomb
          ref: ${{ steps.json-eoc-source.outputs.commit }}
          path: .source/ccb-json-eoc
          fetch-depth: 1
          sparse-checkout: |
            data/reference/json
            tools/json_api

      - name: Check generated JSON/EOC reference and example mod
        run: |
          uv run python scripts/generate_json_eoc_reference.py --source-repo .source/ccb-json-eoc --check
          uv run python scripts/check_json_eoc_example_mod.py --source-repo .source/ccb-json-eoc

      - name: Check generated catalog output
        run: uv run python scripts/generate_catalog.py --check

      - name: Check generated Lua v5 reference and coverage
        run: >-
          uv run python scripts/generate_lua_reference.py
          --source-repo .source/ccb --check --require-luac

      - name: Check marked command examples
        run: uv run python scripts/check_examples.py

      - name: Check catalog and PR-scoped translation policy
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_catalog.py --base-ref "origin/${{ github.base_ref }}"

      - name: Check catalog outside pull requests
        if: github.event_name != 'pull_request'
        run: uv run python scripts/check_catalog.py

      - name: Run policy tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'

      - name: Lint maintenance code
        run: uv run flake8 --max-line-length=100 scripts tests

      - name: Build strict bilingual preview
        run: uv run python scripts/build_site.py --strict --include-drafts

      - name: Check internal, anchor, and critical external links
        run: uv run python scripts/check_links.py --site-dir site --critical
