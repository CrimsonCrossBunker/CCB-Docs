schema_version: 1
validations:
  agent-context:
    description: Agent metadata and routing validation
    authority_paths: [AGENTS.md, ai/project-map.yml, ai/test-matrix.yml]
  android-unit:
    description: Android Gradle unit-test entry point
    authority_paths: [android/gradlew, android/build.gradle]
  cmake-configure:
    description: CMake preset discovery or configuration
    authority_paths: [CMakePresets.json]
  cpp-format:
    description: C++ formatting validation
    authority_paths: [Makefile]
  cpp-tests:
    description: Native test build or focused Catch2 execution
    authority_paths: [Makefile, tests/AGENTS.md]
  json-load:
    description: Repository JSON loading validation
    authority_paths: [Makefile, data/AGENTS.md]
  json-contract:
    description: JSON object-type and EOC parser inventory generation, parity, and coverage
    authority_paths: [tools/json_api, data/reference/json]
  docs-json-eoc-example:
    description: CCB-Docs complete JSON/EOC example mod structural contract validation
    authority_paths: [tools/json_api, data/reference/json]
  json-mod-load:
    description: Real CCB executable validation of a selected mod and its dependencies
    authority_paths: [src/main.cpp, src/mod_manager.cpp, doc/cataclysm.6]
  lua-contract:
    description: Lua declaration, parity, and coverage validation
    authority_paths: [data/lua/types/ccb_api_v5.d.lua, tools/lua_api]
  lua-docs:
    description: Generated bilingual Lua v5 reference and catalog validation
    authority_paths: [config/lua-reference-v5.yml, scripts/generate_lua_reference.py]
