schema_version: 1
kind: repository_settings_target
description: Desired settings only; merging this file does not apply GitHub settings.
enforcement: deferred
default_branch: main
prerequisites:
  minimum_confirmed_human_reviewers: 2
  required_checks_must_succeed_on_default_branch: true
  member_audit_and_notice_before_organization_2fa: true
target:
  pages_source: github_actions
  allow_github_actions_create_pull_requests: true
  actions_bot_may_approve: false
  auto_merge: false
  ruleset:
    name: protected-default-branch
    enforcement: deferred
    branches: [main]
    require_pull_request: true
    required_non_author_human_approvals: 1
    dismiss_stale_reviews: true
    require_conversation_resolution: true
    required_status_checks:
      - Documentation CI / validate
      - Documentation CI / Site QA (Node 22)
    prohibit_force_push: true
    prohibit_branch_deletion: true
    bypass:
      policy: emergency_only
      actors: []
      reason_required: true
  security:
    secret_scanning: enabled_target
    push_protection: enabled_target
    dependency_updates: enabled_target
    organization_2fa: deferred_pending_member_audit_and_notice
  pages_environment_protection: deferred_pending_reviewers
maintenance_workflows:
  weekly: .github/workflows/nightly.yml
  monthly: .github/workflows/monthly-maintenance.yml
  quarterly: .github/workflows/quarterly-maintenance.yml
  release_and_monthly_snapshot: .github/workflows/docs-snapshot.yml
manual_record:
  confirmed_reviewers: []
  reviewer_confirmation_blocker: https://github.com/CrimsonCrossBunker/CCB-Docs/issues/6
